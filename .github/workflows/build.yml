name: "Build Action"

on:
    push:
      branches:
      - main
    workflow_dispatch:

jobs:
    Build-NyarugramAdapterWebUI:
        runs-on: ubuntu-latest
        steps:
          - name: Clone Main Repository
            uses: actions/checkout@v4
            with:
              ref: main
              token: ${{ secrets.TOKEN }}

          - name: Set version
            run: |
              commit_sha=$(git rev-parse --short HEAD)
              version=$(jq -r '.version' package.json)
              echo "version=${version}" >> $GITHUB_ENV

          - name: Use Node.js 20.X
            uses: actions/setup-node@v4
            with:
              node-version: 20.X

          - name: Install dependencies
            run: npm ci

          - name: Lint and type check
            run: |
              npm run webui:lint
              npm run webui:typecheck
              npm run webui:test

          - name: Build NyarugramAdapterWebUI
            run: npm run webui:build

          - name: Upload Artifact
            uses: actions/upload-artifact@v4
            with:
              name: NyarugramAdapterWebUI
              path: dist

          - name: Install zip
            run: sudo apt-get install -y zip

          - name: Compress subdirectories
            run: |
              zip -q -r NyarugramAdapterWebUI.zip dist/*

          - name: Create Release and Upload Artifacts
            if: contains(github.event.head_commit.message, 'release')
            uses: softprops/action-gh-release@v1
            with:
              name: NyarugramAdapterWebUI-v${{ env.version }}
              tag_name: v${{ env.version }}
              token: ${{ secrets.TOKEN }}
              files: |
                NyarugramAdapterWebUI.zip